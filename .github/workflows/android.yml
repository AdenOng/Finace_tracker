name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run mobile:install
      - run: bun run check
      - run: bun run test
      - run: bun run mobile:check
      - run: bun run mobile:test
      - run: bun run mobile:export
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: bun install --frozen-lockfile && bun run mobile:install
      - run: bun x expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a
        working-directory: mobile/android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: finfolio-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
