[project]
name = "finance-tracker"
version = "0.1.0"
description = "Local finance tracker with OCR and LLM categorization"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "fastapi==0.109.0",
  "uvicorn==0.27.0",
  "python-multipart==0.0.6",
  "pydantic==2.5.3",
  "SQLAlchemy==2.0.23",
  "psycopg2-binary==2.9.9",
  "python-dotenv==1.0.0",
  "paddlepaddle==2.5.2",
  "paddleocr==2.7.0.3",
  "pymupdf==1.23.8",
  "llama-cpp-python==0.2.28",
  "Pillow==10.1.0",
  "PyYAML==6.0.1",
]

[project.scripts]
finance-tracker = "finance_tracker.src.cli.interface:main"

[tool.uv]
package = false
