name: finfolio

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-finfolio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-finfolio}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only, so `bun run dev` and drizzle-kit can reach it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opencode:
    build:
      context: ./docker/opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.3}
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      # Credentials from `opencode auth login` on the host (your opencode Go subscription).
      - ${OPENCODE_AUTH_FILE:-~/.local/share/opencode/auth.json}:/home/node/.local/share/opencode/auth.json
    ports:
      - "127.0.0.1:4096:4096"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finfolio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finfolio}
      OPENCODE_URL: http://opencode:4096
      # Admin → Data lists and downloads dumps from here and asks the backup service for new ones.
      BACKUP_DIR: /app/backups
    volumes:
      - uploads:/app/data
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Nightly logical backup into ./backups, kept for BACKUP_RETENTION_DAYS (14). Also runs within a
  # minute when Admin → Data asks for one (control/run-now), and reports back through control/.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # The app container runs as uid 1000 and must be able to read the dumps it offers for download.
      BACKUP_UID: ${BACKUP_UID:-1000}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups/control && chmod 777 /backups/control
        # A dump interrupted by a restart never finished; do not report it as in progress.
        rm -f /backups/control/in-progress
        last=0
        while true; do
          now=$$(date +%s)
          date -u +%Y-%m-%dT%H:%M:%SZ > /backups/control/heartbeat
          if [ -f /backups/control/run-now ] || [ $$((now - last)) -ge 86400 ]; then
            # Marked before the request is cleared, so the app always sees one or the other.
            date -u +%Y-%m-%dT%H:%M:%SZ > /backups/control/in-progress
            rm -f /backups/control/run-now
            ts=$$(date +%Y%m%d-%H%M%S)
            out="/backups/finfolio-$$ts.dump"
            if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$out.partial" 2> /backups/control/last-error; then
              mv "$$out.partial" "$$out"
              chown "$$BACKUP_UID:$$BACKUP_UID" "$$out" && chmod 600 "$$out"
              echo "ok $$(date -u +%Y-%m-%dT%H:%M:%SZ) finfolio-$$ts.dump" > /backups/control/last-run
              echo "backup $$ts ok"
            else
              rm -f "$$out.partial"
              echo "failed $$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /backups/control/last-run
              echo "backup $$ts failed"
            fi
            rm -f /backups/control/in-progress
            last=$$now
            find /backups -name 'finfolio-*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          fi
          sleep 60
        done

  # Optional: only started with `docker compose --profile tunnel up`. If a tunnel already runs
  # elsewhere, point its ingress at http://<this-host>:3000 instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
